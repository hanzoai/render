# Canonical caller; every knob lives in /hanzo.yml. This copy is the one the
# forge (git.hanzo.ai) collects; .github/workflows/cicd.yml is the same caller
# for github.com, which reads workflows from nowhere else.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    secrets: inherit
